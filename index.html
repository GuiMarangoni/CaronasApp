<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Caronas</title>

<link rel="manifest" href="manifest.json">

<style>
body {
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 500px;
  margin: auto;
}

h1 {
  text-align: center;
}

.card {
  background: #1e293b;
  padding: 12px;
  margin: 8px 0;
  border-radius: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.name {
  font-weight: bold;
}

.buttons button {
  border: none;
  padding: 8px 12px;
  margin-left: 5px;
  border-radius: 8px;
  cursor: pointer;
}

.green {
  background: #22c55e;
  color: white;
}

.red {
  background: #ef4444;
  color: white;
}

input {
  padding: 10px;
  border-radius: 8px;
  border: none;
  width: 70%;
}

.add-btn {
  padding: 10px;
  border-radius: 8px;
  border: none;
  background: #3b82f6;
  color: white;
  cursor: pointer;
}

.export {
  width: 100%;
  margin-top: 15px;
  padding: 12px;
  border-radius: 10px;
  border: none;
  background: #f59e0b;
  color: black;
  font-weight: bold;
}

.history {
  margin-top: 20px;
  background: #1e293b;
  padding: 10px;
  border-radius: 10px;
  max-height: 150px;
  overflow-y: auto;
  font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

<h1>🚗 Caronas</h1>

<input id="nameInput" placeholder="Nome">
<button class="add-btn" onclick="addPerson()">Adicionar</button>

<div id="list"></div>

<button class="export" onclick="exportData()">Exportar para WhatsApp</button>

<div class="history" id="history"></div>

</div>

<script>
const STORAGE = "caronas_static";
const HISTORY = "caronas_history";

let people = JSON.parse(localStorage.getItem(STORAGE)) || [
  {name:"JV",rides:21},{name:"Gus",rides:20},{name:"Bella",rides:16},
  {name:"Lore",rides:12},{name:"Miguel",rides:7},{name:"Carol",rides:7},
  {name:"GG",rides:7},{name:"Guto",rides:5},{name:"Igor",rides:4},
  {name:"Elisa",rides:4},{name:"Gian",rides:4},{name:"Talita",rides:3},
  {name:"Mashima",rides:3},{name:"VT",rides:2},{name:"Luiz",rides:2},
  {name:"Hanna",rides:2},{name:"Nico",rides:1}
];

let history = JSON.parse(localStorage.getItem(HISTORY)) || [];

function save(){
  localStorage.setItem(STORAGE, JSON.stringify(people));
  localStorage.setItem(HISTORY, JSON.stringify(history));
}

function log(msg){
  history.unshift(new Date().toLocaleString()+" - "+msg);
  save();
  render();
}

function update(i,delta){
  people[i].rides = Math.max(0, people[i].rides + delta);
  log(people[i].name + ": " + people[i].rides);
}

function addPerson(){
  const name = document.getElementById("nameInput").value;
  if(!name) return;
  people.push({name, rides:0});
  log("Novo: "+name);
}

function exportData(){
  let text = people.sort((a,b)=>b.rides-a.rides)
    .map(p=>p.rides+" "+p.name).join("\n");
  navigator.clipboard.writeText(text);
  alert("Copiado!");
}

function render(){
  const list = document.getElementById("list");
  list.innerHTML = "";

  people.sort((a,b)=>b.rides-a.rides).forEach((p,i)=>{
    const div = document.createElement("div");
    div.className = "card";

    const name = document.createElement("div");
    name.className = "name";
    name.innerText = p.rides + " " + p.name;

    const btns = document.createElement("div");
    btns.className = "buttons";

    const plus = document.createElement("button");
    plus.innerText = "+";
    plus.className="green";
    plus.onclick=()=>update(i,1);

    const minus = document.createElement("button");
    minus.innerText = "-";
    minus.className="red";
    minus.onclick=()=>update(i,-1);

    btns.appendChild(plus);
    btns.appendChild(minus);

    div.appendChild(name);
    div.appendChild(btns);

    list.appendChild(div);
  });

  document.getElementById("history").innerHTML = history.join("<br>");
}

render();
</script>

</body>
</html>
